# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-avb"
BBFILE_PATTERN_meta-avb := "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-avb = "7"
LAYERSERIES_COMPAT_meta-avb = "scarthgap"
LAYERDEPENDS_meta-avb = "core openembedded-layer"
