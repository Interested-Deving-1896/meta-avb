# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "avb"
BBFILE_PATTERN_avb := "^${LAYERDIR}/"
BBFILE_PRIORITY_avb = "7"
LAYERSERIES_COMPAT_avb = "wrynose"
LAYERDEPENDS_avb = "core openembedded-layer"
